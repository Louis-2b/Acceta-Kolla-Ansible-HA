---
# +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# /etc/kolla/globals.yml — Kolla-Ansible — OpenStack 2026.1 (Gazpacho)
# Hôtes : Rocky Linux 10
# +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# Pourquoi 2026.1 : la série 2024.2 est en fin de vie (29/04/2026) et ne
# supporte pas Rocky Linux 10. 2026.1 est une série "SLURP" maintenue
# jusqu'à fin 2027 environ. Voir Docs/Corrections.md pour le détail et
# les sources.
#
# Principe : les services sont activés par phases.
#   Phase 1 (activés) : socle + HA + stockage + services utiles aux tenants.
#   Phase 2 (désactivés, blocs prêts à décommenter) : Octavia, télémétrie.

# ++++++++++++++++++++++
# Configuration générale
# ++++++++++++++++++++++
workaround_ansible_issue_8743: yes

# COPY_ALWAYS : les configs sont régénérées à chaque "deploy"/"reconfigure".
config_strategy: "COPY_ALWAYS"

# Distribution et release (doivent correspondre à la version de
# kolla-ansible installée : stable/2026.1)
kolla_base_distro: "rocky"
openstack_release: "2026.1"
network_address_family: "ipv4"
kolla_container_engine: docker

# Docker : aucun pin de version. Le pin "docker_yum_package_pin: 3:28.*" d'une
# version précédente n'a eu aucun effet (Docker 29.8.2 a été installé par
# bootstrap-servers sur Rocky Linux 10). Cette version a passé
# bootstrap-servers et pull ; elle n'est pas encore validée par un deploy.

# Registre d'images : NE PAS surcharger docker_registry / docker_namespace.
# Les valeurs par défaut de la release pointent vers quay.io/openstack.kolla.
# (docker.io/kolla n'est plus la source des images actuelles.)

# ++++++++++++++++++++
# Configuration réseau
# ++++++++++++++++++++
network_interface: "ens160"
neutron_external_interface: "ens192"
kolla_internal_vip_address: "172.20.10.14"

# Plugin réseau : ML2/Open vSwitch (valeur par défaut de Kolla, explicitée).
# Pour passer à OVN : neutron_plugin_agent: "ovn" (voir Docs/HA-Roadmap.md).
neutron_plugin_agent: "openvswitch"

# À activer uniquement quand il y a au moins 2 nœuds dans le groupe [network]
# (routeurs L3 en HA via VRRP + agents DHCP multiples) :
# enable_neutron_agent_ha: "yes"

# +++++++++++++++++++++++
# Services cœur OpenStack
# +++++++++++++++++++++++
# enable_openstack_core active : Keystone, Glance, Nova, Neutron, Heat, Horizon.
enable_openstack_core: "yes"

# +++++++++++++++++++
# Haute disponibilité
# +++++++++++++++++++
enable_haproxy: "yes"
enable_keepalived: "{{ enable_haproxy | bool }}"

# ++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# TLS
# ++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# VIP interne et externe identiques (une seule adresse) : le précheck de
# Kolla-Ansible 2026.1 refuse d'activer le TLS sur un seul des deux réseaux
# ("must not be the same when only one network has TLS enabled"). Les deux
# doivent donc être activés. Après modification, relancer
# "kolla-ansible certificates" pour générer haproxy.pem ET haproxy-internal.pem.
kolla_enable_tls_internal: "yes"
kolla_enable_tls_external: "yes"

# CA privée générée par "kolla-ansible certificates" : les conteneurs et
# le client en ligne de commande doivent lui faire confiance.
kolla_copy_ca_into_containers: "yes"
openstack_cacert: "/etc/pki/tls/certs/ca-bundle.crt"
kolla_admin_openrc_cacert: "/etc/kolla/certificates/ca/root.crt"

# TLS entre HAProxy et les services (durcissement, étape suivante).
# À n'activer qu'une fois le déploiement de base validé :
# kolla_enable_tls_backend: "yes"
# kolla_verify_tls_backend: "yes"

# FQDN : doit résoudre vers la VIP (voir /etc/hosts, étape 9.4 du README).
kolla_external_fqdn: "openstack.tubie.lan"
kolla_external_vip_address: "172.20.10.14"

# ++++++++++++++++++++++++++++
# Base de données & messagerie
# ++++++++++++++++++++++++++++
enable_mariadb: "yes"
enable_memcached: "yes"
enable_etcd: "yes"

# Cache de sessions Horizon (Valkey remplace Redis)
enable_valkey: "yes"

# ++++++++++++++++++++++++
# Supervision
# ++++++++++++++++++++++++
# Gourmands en RAM : pour un lab à moins de ~8 Go par contrôleur, mettre
# "no" ici et sur Barbican, Magnum et Designate plus bas (voir Docs/Depannage.md).
enable_prometheus: "yes"
enable_grafana: "yes"

# ++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Télémétrie (PHASE 2 — désactivée)
# ++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Gnocchi en backend "file" donne des métriques incohérentes avec
# 3 contrôleurs (chaque nœud a son propre stockage local). À réactiver
# seulement avec un backend partagé (Ceph) ou en mono-contrôleur.
# enable_ceilometer: "yes"
# enable_aodh: "yes"
# enable_gnocchi: "yes"
# gnocchi_backend_storage: "ceph"

# ++++++++++++++++++++++
# Stockage bloc (Cinder)
# ++++++++++++++++++++++
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
# Le volume group doit s'appeler "cinder-volumes" (créé à l'étape 5.2 du README).
# Ne pas définir cinder_enabled_backends : Kolla le calcule à partir des
# options enable_cinder_backend_*.

# Le groupe générique cinder-volume est sur les contrôleurs et cinder-volume-lvm
# sur storage01 : le précheck y voit "plusieurs instances" et exige un
# cinder_cluster_name. Un cluster suppose un stockage partagé (Ceph), pas le
# LVM local de storage01 : on saute donc ce contrôle. À retirer avec Ceph.
cinder_cluster_skip_precheck: true

# Sauvegarde des volumes : DÉSACTIVÉE pour le moment. Elle utilisait Swift
# comme destination, or Swift est désactivé (voir plus bas). Pour la remettre,
# choisir un autre backend (NFS, Ceph, S3) et définir cinder_backup_driver.
enable_cinder_backup: "no"
# cinder_backup_driver: "nfs"

# ++++++++++++++++++++++
# Stockage objet (Swift)
# ++++++++++++++++++++++
# DÉSACTIVÉ : les images conteneur Swift ne sont pas publiées sur quay.io pour
# la série 2026.1 (seule l'étiquette 2024.2-rocky-9 existe pour
# swift-proxy-server), alors que les images nova-api et keystone existent bien
# en 2026.1-rocky-10. Avec enable_swift: "yes", le déploiement chercherait des
# images introuvables. Voir Docs/Depannage.md.
enable_swift: "no"

# ++++++++++++++++++++++++++++++
# Gestion des secrets (Barbican)
# ++++++++++++++++++++++++++++++
enable_barbican: "yes"

# ++++++++++++++++++++++++++++
# Clusters Kubernetes (Magnum)
# ++++++++++++++++++++++++++++
enable_magnum: "yes"

# +++++++++++++++
# DNS (Designate)
# +++++++++++++++
enable_designate: "yes"
enable_designate_backend_bind9: "yes"
designate_backend: "bind9"
neutron_dns_domain: "tubie.ops."

# ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Octavia — Load Balancer as a Service (PHASE 2 — désactivé)
# ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Prérequis avant de l'activer :
#   1. construire et téléverser une image "amphora" dans Glance (étiquette
#      "amphora", égale à octavia_amp_image_tag) ;
#   2. disposer d'un réseau de gestion lb-mgmt-net joignable par les
#      contrôleurs (interface octavia_network_interface avec une IP) ;
#   3. générer les certificats : kolla-ansible octavia-certificates.
# Note : octavia_amp_flavor et octavia_amp_network sont des DICTIONNAIRES,
# et octavia_amp_boot_network_list attend l'ID d'un réseau Neutron, pas un CIDR.
#
# enable_octavia: "yes"
# octavia_network_interface: "ens160"
# octavia_amp_image_tag: "amphora"
# octavia_amp_flavor:
#   name: "amphora"
#   is_public: no
#   vcpus: 1
#   ram: 1024
#   disk: 5
# octavia_amp_network:
#   name: lb-mgmt-net
#   provider_network_type: flat
#   provider_physical_network: physnet1
#   external: false
#   shared: false
#   subnet:
#     name: lb-mgmt-subnet
#     cidr: "10.1.2.0/24"
#     gateway_ip: "10.1.2.1"
#     enable_dhcp: yes
# LAB UNIQUEMENT (déconseillé en production par la documentation) :
# octavia_network_type: "tenant"

# +++++++++++++++++++++++++
# Service d'images (Glance)
# +++++++++++++++++++++++++
glance_backend_file: "yes"
glance_file_datadir_volume: "/mnt/glance"

# IMPORTANT en HA multi-contrôleurs : /mnt/glance DOIT être un point de
# montage PARTAGÉ et IDENTIQUE sur tous les nœuds contrôleurs (NFS depuis
# storage01, étape 6 du README). Un répertoire local par nœud provoquerait
# des images invisibles selon le contrôleur qui répond.
# Alternative en production avec Ceph externe :
# glance_backend_file: "no"
# glance_backend_ceph: "yes"

# ++++++++++++++++++++++++++++++++++++++++++++++++++++
# Nova — virtualisation imbriquée (VMware Workstation)
# ++++++++++++++++++++++++++++++++++++++++++++++++++++
# Par défaut Kolla utilise KVM. Si la virtualisation imbriquée n'est pas
# disponible sur compute01, décommentez (VMs plus lentes) :
# nova_compute_virt_type: "qemu"
